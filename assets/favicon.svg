<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="disc">
      <circle cx="32" cy="32" r="31"/>
    </clipPath>
    <mask id="crescent">
      <rect width="64" height="64" fill="black"/>
      <circle cx="32" cy="32" r="13.5" fill="white"/>
      <circle cx="36.5" cy="32" r="11" fill="black"/>
    </mask>
  </defs>
  <!-- round flag badge -->
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="32" height="64" fill="#006233"/>
    <rect x="32" y="0" width="32" height="64" fill="#ffffff"/>
    <rect width="64" height="64" fill="#d21034" mask="url(#crescent)"/>
    <path fill="#d21034" d="M40.5,24.8 L42.2,29.6 L47.3,29.7 L43.2,32.8 L44.7,37.6 L40.5,34.7 L36.3,37.6 L37.8,32.8 L33.7,29.7 L38.8,29.6 Z"/>
  </g>
  <!-- crisp edge so the disc reads on any tab colour -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
