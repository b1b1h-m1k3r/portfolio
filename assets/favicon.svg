<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- System constellation: blueprint orbit (crescent), star node, green nodes -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#f4f1e8" stroke="#006233" stroke-opacity="0.3" stroke-width="1.2"/>
  <!-- orbit arc (crescent reinterpreted) -->
  <path d="M44.8,30.4 A15 15 0 1 1 32.6,18.2" fill="none" stroke="#006233" stroke-width="2.6" stroke-linecap="round"/>
  <!-- connections -->
  <line x1="38" y1="26" x2="18" y2="46" stroke="#006233" stroke-width="1.8"/>
  <line x1="38" y1="26" x2="45" y2="45" stroke="#006233" stroke-width="1.8"/>
  <line x1="38" y1="26" x2="19" y2="22" stroke="#006233" stroke-width="1.8"/>
  <!-- nodes -->
  <circle cx="18" cy="46" r="3" fill="#006233"/>
  <circle cx="45" cy="45" r="3" fill="#006233"/>
  <circle cx="19" cy="22" r="3" fill="#006233"/>
  <!-- the star node (Algerian red star) -->
  <path fill="#d21034" d="M38,19.5 L39.5,24.1 L44.3,24.1 L40.4,27 L41.9,31.6 L38,28.7 L34.1,31.6 L35.6,27 L31.7,24.1 L36.5,24.1 Z"/>
</svg>
